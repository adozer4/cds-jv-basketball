 const L=lineScore(g),n=L.n,pl=g.plen||8,half=pl*30,us={},op={},unk={us:0,op:0},key=(q,c)=>q>4?''+q:q+(c>=half?'a':'b');
 const add=(m,t,q,c,d)=>{if(c==null)unk[t]+=d;else{const k=key(q,c);m[k]=(m[k]||0)+d}};
 g.events.forEach(e=>{if(e.m&&(e.t==='fg'||e.t==='ft'))add(us,'us',e.q||1,e.c,e.t==='fg'?(e.th?3:2):1)});
 (g.log||[]).forEach(e=>{if(e.k==='opp')add(op,'op',e.q||1,e.c,e.d)});
 const cols=[];for(let q=1;q<=n;q++){if(q<=4)cols.push(q+'a',q+'b');else cols.push(''+q)}
 const okUs=unk.us===0,okOp=unk.op===0&&Object.values(op).reduce((a,b)=>a+b,0)===g.opp;
 return{n,pl,cols,us,op,okUs,okOp}}
function segTable(){const g=G,Z=segScore(g);if(!Z.okUs&&!Z.okOp)return '';
 const m=Z.pl/2,hd=Array.from({length:Z.n},(_,i)=>i<4?`<th colspan="2">Q${i+1}</th>`:`<th rowspan="2">OT${i-3}</th>`).join(''),sub=Array.from({length:Math.min(Z.n,4)},()=>`<th>1st ${m}</th><th>2nd ${m}</th>`).join('');
 const cell=(v,ok)=>`<td>${ok?(v||0):'-'}</td>`,r=(lab,o,ok,t)=>`<tr><td><b>${lab}</b></td>${Z.cols.map(k=>cell(o[k],ok)).join('')}<td><b>${t}</b></td></tr>`;
 const diff=Z.okUs&&Z.okOp?`<tr><td class="mu">Margin</td>${Z.cols.map(k=>{const d=(Z.us[k]||0)-(Z.op[k]||0);return `<td class="mu">${d>0?'+'+d:d}</td>`}).join('')}<td></td></tr>`:'';
 return `<h4 style="margin:12px 0 4px">Points by ${m}-minute segment</h4><table><tr><th rowspan="2">Team</th>${hd}<th rowspan="2">Final</th></tr><tr>${sub}</tr>${r('CDS',Z.us,Z.okUs,ptsE(g))}${r(esc(oppName(g)),Z.op,Z.okOp,g.opp)}${diff}</table>${Z.okUs&&Z.okOp?'':'<p class="mu" style="margin:6px 0 0;font-size:13px">Some points have no clock time, so segments for that team show a dash.</p>'}`}
function lineCard(){const L=lineScore(G),h=Array.from({length:L.n},(_,i)=>`<th>${i<4?i+1:'OT'+(i-3)}</th>`).join(''),r=(lab,a,t,ok)=>`<tr><td><b>${lab}</b></td>${a.map(x=>`<td>${ok?x:'-'}</td>`).join('')}<td><b>${t}</b></td></tr>`;
 return `<div class="card sc"><div class="sb"><h3>Line score${G.final?' (final)':''}</h3>${EDIT?'<button class="b" style="padding:4px 10px" onclick="oqOpen()">Edit opponent quarters</button>':''}</div><table><tr><th>Team</th>${h}<th>Final</th></tr>${r('CDS',L.us,L.ut,1)}${r(esc(oppName(G)),L.op,L.ot,L.ok||!L.ot)}</table>${segTable()}${L.ok||!L.ot?'':'<p class="mu" style="margin:6px 0 0;font-size:13px">Opponent points by quarter were not recorded for this game.</p>'}</div>`}
function statsV(){return '<button class="b" style="margin-bottom:8px" onclick="go(\'schedule\')">\u2190 Season</button>'+(EDIT?'':gameSel())+lineCard()+runsCard()+statsV0()+(em?emModal():'')+(oq?oqModal():'')+(mp?mpModal():'')+(pp?paperModal():'')}
const numKey=p=>{const n=parseInt(p.num);return isNaN(n)?1e9:n};
function sortRows(t,list,acc,def){const c=(S.sort||{})[t]||def;if(!c)return list;const f=acc[c.k];return [...list].sort((a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*c.d||(numKey(a.p)-numKey(b.p))||String(a.p.name).localeCompare(String(b.p.name))})}
function sortTable(t,cols,rows,def){const c=(S.sort||{})[t]||def,i=c?cols.findIndex(x=>x[0]===c.k)+1:0;
 return `<table data-s="${c&&c.k!=='name'?i:0}"><tr>${cols.map(([k,l])=>`<th class="sh" onclick="sortBy('${t}','${k}')">${l}${c&&c.k===k?(c.d<0?' ▼':' ▲'):''}</th>`).join('')}</tr>${rows}</table>`}
function sortBy(t,k){S.sort=S.sort||{};const c=S.sort[t]||{box:{k:'name',d:1},season:{k:'pts',d:-1}}[t];S.sort[t]=(c&&c.k===k)?{k,d:-c.d}:{k,d:k==='name'?1:-1};render()}
function sortReset(t){if(S.sort)delete S.sort[t];render()}
const BOXC=[['name','Player'],['min','Min'],['pts','Pts'],['fgm','FG'],['twm','2P'],['tpm','3P'],['ftm','FT'],['oreb','OR'],['dreb','DR'],['reb','Reb'],['ast','Ast'],['stl','Stl'],['blk','Blk'],['to','TO'],['pf','PF'],['pm','+/-']];
const SEAC=[['name','Player'],['gp','GP'],['min','Min'],['pts','Pts'],['reb','Reb'],['ast','Ast'],['stl','Stl'],['blk','Blk'],['to','TO'],['fgp','FG%'],['twp','2P%'],['tpp','3P%'],['ftp','FT%'],['efg','eFG'],['ts','TS'],['ato','A/TO'],['pm','+/-'],['pm32','+/-32']];
const mk=(m,a)=>m+(a?m/a/100:0);
function statsV0(){
 const R=S.roster.map(p=>({p,r:st(p.id)})),T={};
 ['pts','fgm','fga','tpm','tpa','twm','twa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'].forEach(k=>T[k]=R.reduce((a,x)=>a+x.r[k],0));
 const BX=sortRows('box',R,{name:x=>numKey(x.p),min:x=>G.secs[x.p.id]||0,pts:x=>x.r.pts,fgm:x=>mk(x.r.fgm,x.r.fga),twm:x=>mk(x.r.twm,x.r.twa),tpm:x=>mk(x.r.tpm,x.r.tpa),ftm:x=>mk(x.r.ftm,x.r.fta),oreb:x=>x.r.oreb,dreb:x=>x.r.dreb,reb:x=>x.r.reb,ast:x=>x.r.ast,stl:x=>x.r.stl,blk:x=>x.r.blk,to:x=>x.r.to,pf:x=>x.r.pf,pm:x=>x.r.pm||0},{k:'name',d:1});
 const row=(l,m,r)=>`<tr><td>${l}</td><td>${m}</td><td>${r.pts}</td><td>${r.fgm}-${r.fga}</td><td>${r.twm}-${r.twa}</td><td>${r.tpm}-${r.tpa}</td><td>${r.ftm}-${r.fta}</td><td>${r.oreb}</td><td>${r.dreb}</td><td>${r.reb}</td><td>${r.ast}</td><td>${r.stl}</td><td>${r.blk}</td><td>${r.to}</td><td>${r.pf}</td><td>${r.pm??''}</td></tr>`;
 const fv=S.fv==='all'?null:S.fv,shots=G.events.filter(e=>e.t==='fg'&&(!fv||e.p===fv));
 const m=shots.filter(e=>e.m).length,t3=shots.filter(e=>e.th),m3=t3.filter(e=>e.m).length;
 return `<div class="card sc"><div class="sb" style="flex-wrap:wrap"><h3>Box score: ${esc(G.name)}</h3><span class="row">${EDIT?'<button class="b" onclick="emailOpen()">Email staff</button><button class="b" onclick="mpOpen()">MaxPreps file</button><button class="b" onclick="paperOpen()">Newspaper</button>':''}<button class="b p" onclick="exportPDF()">Export PDF</button></span></div><p class="msg">${msg}</p><p class="mu" style="margin:0 0 6px">Tap any column heading to sort by it, and tap again to flip the order. Player sorts by jersey number.</p>${(S.sort||{}).box?'<button class="b" style="padding:2px 10px;margin-bottom:6px" onclick="sortReset(\'box\')">Default order</button>':''}${sortTable('box',BOXC,BX.map(x=>row(plk(x.p),fmt(G.secs[x.p.id]||0),x.r)).join('')+(R.length?row('<b>Team</b>','',T):''),{k:'name',d:1})}${R.length?'':'<p class="mu">No players yet.</p>'}</div>
<div class="card"><div class="sb"><h3>Shot chart</h3><select onchange="setFv(this.value)"><option value="all">Whole team</option>${S.roster.map(p=>`<option value="${p.id}"${fv===p.id?' selected':''}>${lbl(p)}</option>`).join('')}</select></div>
<p class="mu" style="margin:0 0 6px">FG ${m}/${shots.length} (${pct(m,shots.length)}), 3P ${m3}/${t3.length} (${pct(m3,t3.length)}). Green dots are makes, red marks are misses.</p>${court(shots,0)}</div>`}
function setupV(){if(EDIT&&TR===null&&!TRL){TRL=true;loadTrash()}return '<h2 class="ttl2">Settings</h2>'+(EDIT?addGameCard():'')+setupV0()+trashCard()+mpCard()+(LG!==null?logModal():'')+(eg!==null?egModal():'')}
function addGameCard(){return `<details class="card" ${OPEN.addg?'open':''} ontoggle="OPEN.addg=this.open"><summary style="cursor:pointer"><h3 style="display:inline">Add a game</h3></summary><p class="mu" style="margin:8px 0 6px">Use this for a game that is not on the schedule, like a scrimmage, or one you want to add after it was played. Pick the date, then open it from the Season tab.</p><div class="row" style="align-items:center"><input id="gn" placeholder="vs or @ opponent, like vs HGC" style="flex:2;min-width:170px"><input id="gd" type="date" value="${today()}" style="flex:1"><input id="gt" placeholder="Time, like 4:00pm" style="flex:1;min-width:110px"><label style="white-space:nowrap"><input id="gc" type="checkbox"> Conf</label><button class="b p" onclick="newG()">Add game</button></div><button class="b" style="margin-top:8px" onclick="impSched()">Import JV 2026-27 schedule</button><p class="msg">${msg}</p></details>`}
function setupV0(){
 return `<details class="card" ${OPEN['addp']?'open':''} ontoggle="OPEN['addp']=this.open"><summary style="cursor:pointer"><h3 style="display:inline">Add player</h3></summary><div style="margin-top:8px"><div class="row"><input id="pn" placeholder="No." inputmode="numeric" style="width:70px">${posSel('','id="pp"')}<input id="pm" placeholder="Name" style="flex:1;min-width:120px"><button class="b p" onclick="addP()">Add</button></div></div></details>
<details class="card" ${OPEN['roster']?'open':''} ontoggle="OPEN['roster']=this.open"><summary style="cursor:pointer"><h3 style="display:inline">Roster</h3></summary><div style="margin-top:8px"><p class="mu" style="margin-top:0">Tap a number, position or name to change it. Changes save automatically. Positions: G guard, W wing, B big. They set the order of players on the game screen (guards left, then wings, then bigs, lowest number first).</p>${S.roster.map(p=>`<div class="sb" style="padding:6px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap"><span class="row" style="flex:1;margin-right:8px"><input value="${esc(p.num)}" placeholder="No." inputmode="numeric" style="width:64px" onchange="editP(${p.id},'num',this.value)">${posSel(p.pos,`onchange="editP(${p.id},'pos',this.value)"`)}<input value="${esc(p.name)}" placeholder="Name" style="flex:1;min-width:100px" onchange="editP(${p.id},'name',this.value)"></span><button class="b" onclick="delP(${p.id})">Remove</button><div class="row" style="width:100%;margin-top:6px">${bioSel(p)}</div></div>`).join('')||'<span class="mu">No players yet.</span>'}</div></details>
<details class="card" ${OPEN['gs']?'open':''} ontoggle="OPEN['gs']=this.open"><summary style="cursor:pointer"><h3 style="display:inline">Game settings</h3></summary><div style="margin-top:8px"><div class="sb" style="margin-bottom:8px"><span class="mu">Coach mode is on for this device. ${VER}</span><button class="b" onclick="logout()">Log out</button></div><label>Period length (minutes) <input type="number" min="1" value="${G.plen}" style="width:80px" onchange="setLen(this.value)"></label><p class="mu">Data is saved in this browser on this device. Use the same phone or tablet each game.</p></div></details><details class="card" ${OPEN['bk']?'open':''} ontoggle="OPEN['bk']=this.open"><summary style="cursor:pointer"><h3 style="display:inline">Backup</h3></summary><div style="margin-top:8px"><p class="mu" style="margin-top:0">Save your whole season to a file, or restore it on this or another device.</p><div class="row"><button class="b p" onclick="backup()">Back up season</button><label class="b">Restore from file<input type="file" accept=".json,application/json" style="display:none" onchange="readBk(this.files[0])"></label></div>${RB?`<p>Backup found: ${RB.roster.length} players, ${RB.games.length} games. <button class="b r" onclick="applyBk()">Replace my data with this backup</button></p>`:''}<p class="msg">${BM}</p>${BK?`<textarea readonly rows="6" style="width:100%" onfocus="this.select()">${esc(BK)}</textarea>`:''}<details style="margin-top:8px"><summary>Paste backup text instead</summary><textarea id="pb" rows="4" style="width:100%;margin:6px 0"></textarea><button class="b" onclick="loadBk($('#pb').value)">Load pasted backup</button></details></div></details>`}
const GEAR='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
function loginV(){return `<div style="max-width:340px;margin:12vh auto 0;padding:0 16px;text-align:center"><img src="logo.png" alt="" style="width:96px;height:96px" onerror="this.style.display='none'"><h1 class="ttl" style="margin:10px 0 0">Covenant Day Lions</h1><div class="sub" style="margin-bottom:18px">JV Boys Basketball &middot; Staff only</div><div class="card"><input id="pw" type="password" placeholder="Passcode" autocomplete="current-password" style="width:100%;box-sizing:border-box;margin-bottom:8px" onkeydown="if(event.key==='Enter')login()"><button class="b p" style="width:100%" onclick="login()">Log in</button><p class="msg">${LM}</p></div></div>`}

 if(!ROLE){$('#app').innerHTML=loginV();$('#app').className='';return}
 const h0=location.hash.slice(1);if(h0==='season'||h0==='lines'||h0==='setup'){if(h0!=='setup')S.sv=h0==='lines'?'lines':'players';history.replaceState(null,'',h0==='setup'?'#settings':'#stats')}
 const t=tab();let h;
 if(t==='game'){h=`<div class="gbar"><button class="b" onclick="go('schedule')">\u2190 Season</button><b class="gn">${esc(G.name)}</b>${EDIT?`<span class="syc2" id="sy">${SY}</span>`:''}<button class="b" onclick="boxFromGame()">Box score</button></div>`+gameV()+(LG!==null?logModal():'')}
 else{const nm={home:'Home',schedule:'Season',stats:'Stats',},cur=t==='box'?'schedule':t;
  h=`<div class="hdr"><img src="logo.png" alt="" onerror="this.style.display='none'"><div><h1 class="ttl">Covenant Day Lions</h1><div class="sub">JV Boys Basketball</div></div>${EDIT?`<span class="syc" id="sy">${SY}</span><button class="gear${t==='settings'?' on':''}" onclick="go('settings')" aria-label="Settings">${GEAR}</button>`:(STAFF?`<button class="b" style="margin-left:auto;padding:4px 10px" onclick="logout()">Log out</button>`:'')}</div><nav>${Object.keys(nm).map(k=>`<button class="${cur===k?'a':''}" onclick="go('${k}')">${nm[k]}</button>`).join('')}</nav>`+(t==='box'&&FROMG?`<div style="margin:8px 0"><button class="b p" onclick="go('game')">\u2190 Back to game</button></div>`:'')+(PL&&(t==='stats'||t==='box')?playerV:{home:homeV,schedule:scheduleV,stats:statsTabV,box:statsV,settings:setupV,scout:scoutV}[t])()}
 $('#app').innerHTML=h;$('#app').className=t==='game'?'g':'';document.querySelectorAll('textarea.ag').forEach(agrow);if(t==='schedule'&&SCRL){SCRL=false;const e=document.getElementById('lastdone');if(e)e.scrollIntoView({block:'start'})}if(t!=='game')wake(false);msg='';save()}
